<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام مديرية أوقاف السويداء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:#0e3a34; --deep2:#124a42; --gold:#c9a24b; --gold-light:#e8d9a8;
    --cream:#f6f2e9; --paper:#ffffff; --ink:#1c2b28; --muted:#5f7570;
    --danger:#a5423a; --good:#3d7a5c; --border:#dcd3bd;
  }
  *{box-sizing:border-box;}
  html, body{height:100%;}
  body{margin:0;font-family:'Tajawal',sans-serif;background:var(--cream);color:var(--ink);}
  #app{display:flex;height:100vh;overflow:hidden;}

  #sidebar{width:280px;flex-shrink:0;background:linear-gradient(180deg,var(--deep) 0%, var(--deep2) 100%);color:#eee7d0;display:flex;flex-direction:column;height:100vh;overflow:hidden;position:relative;transition:width .2s ease;}
  .sidebar-collapse-btn{position:absolute;top:26px;left:-13px;width:26px;height:26px;border-radius:50%;
    background:var(--gold);color:var(--deep);border:2px solid var(--paper);display:flex;align-items:center;
    justify-content:center;cursor:pointer;font-size:13px;font-weight:900;z-index:5;transition:transform .2s ease;
    box-shadow:0 1px 4px rgba(0,0,0,.25);user-select:none;}
  @media(min-width:881px){
    #sidebar.collapsed{width:72px;}
    #sidebar.collapsed .brand-text, #sidebar.collapsed .nav-item .lbl-text, #sidebar.collapsed .nav-sub,
    #sidebar.collapsed .chev, #sidebar.collapsed .user-box .name, #sidebar.collapsed .user-box .role,
    #sidebar.collapsed .user-box .logout-link{display:none;}
    #sidebar.collapsed .brand{justify-content:center;padding:22px 4px 16px;}
    #sidebar.collapsed .nav-item{justify-content:center;padding:11px 6px;}
    #sidebar.collapsed .nav-item .lbl{gap:0;}
    #sidebar.collapsed .user-box{text-align:center;padding:14px 4px;}
    #sidebar.collapsed .sidebar-collapse-btn{transform:rotate(180deg);}
  }
  .brand{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:12px;}
  .brand-emblem{width:52px;height:52px;object-fit:contain;flex-shrink:0;}
  .brand-text .t1{font-size:14.5px;font-weight:700;color:#f4ecd6;line-height:1.4;}
  .brand-text .t2{font-size:12px;color:var(--gold-light);}
  #nav{flex:1;overflow-y:auto;padding:10px 10px 20px;}
  .nav-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 14px;border-radius:9px;cursor:pointer;margin-bottom:3px;font-size:14.5px;color:#e7e1cd;transition:background .15s;}
  .nav-item:hover{background:rgba(255,255,255,.08);}
  .nav-item.active{background:var(--gold);color:var(--deep);font-weight:700;}
  .nav-item .lbl{display:flex;align-items:center;gap:10px;}
  .nav-item svg{width:18px;height:18px;flex-shrink:0;}
  .nav-sub{margin:2px 8px 8px 20px;border-right:2px solid rgba(255,255,255,.15);padding-right:10px;}
  .nav-sub .nav-item{font-size:13.5px;padding:8px 12px;}
  .chev{transition:transform .15s;font-size:11px;}
  .chev.open{transform:rotate(90deg);}
  .user-box{padding:14px 18px;border-top:1px solid rgba(255,255,255,.12);font-size:12.5px;color:#e7e1cd;}
  .user-box .name{font-weight:700;color:#f4ecd6;}
  .user-box .role{color:var(--gold-light);margin-top:2px;}
  .user-box .logout-link{margin-top:8px;display:inline-block;color:#f2c9c9;cursor:pointer;text-decoration:underline;font-size:12px;}

  #main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
  #topbar{background:var(--paper);border-bottom:1px solid var(--border);padding:16px 26px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  #topbar h1{font-size:19px;margin:0;font-weight:700;color:var(--deep);}
  #topbar .sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
  #content{padding:24px 26px;flex:1;overflow-y:auto;}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px;}
  .card{background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .card .n{font-size:26px;font-weight:900;color:var(--deep);}
  .card .l{font-size:12.5px;color:var(--muted);margin-top:4px;}
  .card.accent{border-color:var(--gold);}

  .panel{background:var(--paper);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .panel-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .panel-head h2{font-size:16px;margin:0;color:var(--deep);}
  .search{border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-family:inherit;font-size:13.5px;width:220px;}
  .btn{background:var(--deep);color:#f5efdc;border:none;padding:9px 16px;border-radius:8px;font-family:inherit;font-size:13.5px;cursor:pointer;font-weight:700;}
  .btn:hover{background:var(--deep2);}
  .btn.gold{background:var(--gold);color:var(--deep);}
  .btn.ghost{background:transparent;color:var(--deep);border:1px solid var(--border);}
  .btn.danger{background:var(--danger);color:#fff;}
  .btn.sm{padding:5px 10px;font-size:12px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{background:#f1ece0;color:var(--deep);text-align:right;padding:10px 14px;font-weight:700;border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:10px 14px;border-bottom:1px solid #eee6d2;color:var(--ink);}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:#faf7ee;}
  .tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .tag.good{background:#e2f0e6;color:var(--good);}
  .tag.warn{background:#fbeecb;color:#8a6416;}
  .tag.bad{background:#f6e1de;color:var(--danger);}
  .row-actions{display:flex;gap:6px;justify-content:flex-start;flex-wrap:wrap;}
  .empty{padding:50px 20px;text-align:center;color:var(--muted);}
  .empty .big{font-size:34px;margin-bottom:8px;}
  .no-access{padding:40px 20px;text-align:center;color:var(--muted);}

  #overlay{position:fixed;inset:0;background:rgba(14,20,18,.55);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;}
  #overlay.show{display:flex;}
  #modal{background:var(--paper);border-radius:14px;width:100%;max-width:940px;padding:24px 28px;}
  #modal h3{margin:0 0 16px;color:var(--deep);font-size:17px;}
  #modal .form-error{background:#f6e1de;color:var(--danger);padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:2px 20px;}
  .field{margin-bottom:13px;min-width:0;}
  .field.field-full{grid-column:1 / -1;}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:700;}
  .field input, .field select, .field textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:13.5px;background:#fffdf8;}
  .field textarea{resize:vertical;min-height:60px;}
  .modal-actions{display:flex;gap:8px;justify-content:flex-start;margin-top:6px;padding-top:14px;border-top:1px solid var(--border);}
  @media(max-width:640px){ .form-grid{grid-template-columns:1fr;} #modal{padding:20px;} }

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--deep);color:#f5efdc;padding:11px 20px;border-radius:9px;font-size:13.5px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center;}
  .toast.show{opacity:1;}
  .toast.error{background:var(--danger);}

  .stat-strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .stat-strip .s{background:#f1ece0;border-radius:9px;padding:10px 16px;font-size:13px;}
  .stat-strip .s b{color:var(--deep);}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#c9c2a8;border-radius:6px;}

  @media(max-width:880px){
    #sidebar{position:fixed;z-index:40;height:100vh;transform:translateX(280px);transition:transform .2s;width:280px !important;}
    #sidebar.open{transform:translateX(0);}
    .sidebar-collapse-btn{display:none;}
    #main{width:100%;}
    .search{width:140px;}
  }
  #menuBtn{display:none;background:var(--deep);color:#fff;border:none;border-radius:8px;padding:8px 10px;cursor:pointer;}
  @media(max-width:880px){ #menuBtn{display:inline-block;} }

  @media print{ #sidebar,#topbar,.no-print{display:none !important;} #content{padding:0;} body{background:#fff;} }

  /* Login screen */
  #loginScreen{position:fixed;inset:0;background:linear-gradient(160deg,var(--deep),var(--deep2));display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  #loginScreen.hide{display:none;}
  .login-card{background:var(--paper);border-radius:16px;padding:36px 34px;width:100%;max-width:380px;text-align:center;}
  .login-card img{width:70px;height:70px;object-fit:contain;margin-bottom:10px;}
  .login-card h1{font-size:17px;color:var(--deep);margin:0 0 4px;}
  .login-card .sub{font-size:12.5px;color:var(--muted);margin-bottom:22px;}
  .login-card .field{text-align:right;}
  .login-card .btn{width:100%;padding:11px;font-size:14.5px;margin-top:6px;}
  .login-card .form-error{background:#f6e1de;color:var(--danger);padding:9px 12px;border-radius:8px;font-size:12.5px;margin-bottom:14px;}
  .login-card .api-config{margin-top:18px;font-size:11px;color:var(--muted);}
  .login-card .api-config input{width:100%;font-size:11px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;margin-top:4px;text-align:left;direction:ltr;}
  #loadingScreen{position:fixed;inset:0;background:var(--cream);display:flex;align-items:center;justify-content:center;z-index:99;font-size:14px;color:var(--muted);}

  /* Filters + import/export toolbar */
  .filter-bar{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px;border-bottom:1px solid var(--border);background:#faf7ee;}
  .filter-bar select{border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-family:inherit;font-size:12.5px;background:#fffdf8;min-width:130px;}
  .filter-bar .clear-filters{font-size:12px;color:var(--danger);cursor:pointer;align-self:center;text-decoration:underline;}
</style>

<script>
/* ==================================================================
   إعداد الاتصال بالخادم الحقيقي
   ================================================================== */
let API_BASE = localStorage.getItem('__awqaf_api_base__') || 'https://awqafsystem-9k0eslh5.b4a.run/api';
// ملاحظة: نستخدم localStorage هنا فقط لتذكّر عنوان الخادم على هذا الجهاز
// (وهو ليس بيانات حساسة) — لا تُخزَّن هنا أي كلمة سر أو توكن إطلاقاً.
// كل التوكنات الفعلية تعيش فقط في كوكيز httpOnly يديرها المتصفح والخادم.

let currentUser = null;   // { id, username, fullName, role, permissions, mustChangePassword }
let forcedPasswordChangeActive = false;
let sidebarCollapsed = localStorage.getItem('__awqaf_sidebar_collapsed__') === '1';

function applySidebarCollapsedState(){
  const sidebar = document.getElementById('sidebar');
  if (sidebar) sidebar.classList.toggle('collapsed', sidebarCollapsed);
}
function toggleSidebarCollapse(){
  sidebarCollapsed = !sidebarCollapsed;
  localStorage.setItem('__awqaf_sidebar_collapsed__', sidebarCollapsed ? '1' : '0');
  applySidebarCollapsedState();
}
let cache = {};           // مخزن مؤقت بالذاكرة لنتائج القوائم بعد جلبها من الخادم
let currentModule = 'dashboard';
let openGroups = { finance:true, projects:false };
let searchTerms = {};
let filterState = {}; // { entityKey: { fieldKey: 'قيمة مختارة' } }

function showToast(msg, isError){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.toggle('error', !!isError);
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2600);
}
function getCookie(name){
  const m = document.cookie.match(new RegExp('(?:^|; )'+name+'=([^;]*)'));
  return m ? decodeURIComponent(m[1]) : null;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function pgDate(v){ return v ? String(v).slice(0,10) : ''; }
function fmtDate(v){ return v ? String(v).slice(0,10) : '—'; }

/* ------------------------------------------------------------------
   طبقة الاتصال بالـ API: تضيف الكوكيز، ترويسة CSRF، وتُجدد الجلسة
   تلقائياً مرة واحدة عند انتهاء صلاحية توكن الوصول (401).
   ------------------------------------------------------------------ */
async function api(path, { method = 'GET', body } = {}, _retried) {
  const opts = {
    method,
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
  };
  if (method !== 'GET') {
    const csrf = getCookie('csrf_token');
    if (csrf) opts.headers['X-CSRF-Token'] = csrf;
  }
  if (body !== undefined) opts.body = JSON.stringify(body);

  let res;
  try {
    res = await fetch(API_BASE + path, opts);
  } catch (netErr) {
    throw new Error('تعذّر الاتصال بالخادم — تأكد أن الخادم يعمل وأن عنوان API صحيح (' + API_BASE + ')');
  }

  if (res.status === 401 && !_retried && path !== '/auth/login') {
    const refreshed = await fetch(API_BASE + '/auth/refresh', { method: 'POST', credentials: 'include' });
    if (refreshed.ok) return api(path, { method, body }, true);
    throw new Error('SESSION_EXPIRED');
  }

  let data = null;
  try { data = await res.json(); } catch (e) { /* body may be empty */ }

  if (!res.ok) {
    throw new Error((data && data.error) || `خطأ غير متوقع (${res.status})`);
  }
  return data;
}

/* ------------------------------------------------------------------
   الصلاحيات: هل يملك المستخدم الحالي صلاحية معينة؟
   ------------------------------------------------------------------ */
function can(permissionCode){
  if (!currentUser) return false;
  if (currentUser.role === 'مدير النظام' || currentUser.roleCode === 'admin') return true;
  return (currentUser.permissions || []).includes(permissionCode);
}

/* ==================================================================
   تسجيل الدخول / الخروج
   ================================================================== */
async function tryRestoreSession(){
  try {
    const data = await api('/auth/me');
    currentUser = normalizeUser(data.user);
    showApp();
  } catch (e) {
    showLogin();
  } finally {
    document.getElementById('loadingScreen').style.display = 'none';
  }
}

function normalizeUser(u){
  return { id: u.id, username: u.username, fullName: u.fullName, roleCode: u.role, permissions: u.permissions || [], mustChangePassword: u.mustChangePassword };
}

function showLogin(){
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').classList.remove('hide');
  document.getElementById('apiBaseInput').value = API_BASE;
}
function showApp(){
  document.getElementById('loginScreen').classList.add('hide');
  document.getElementById('app').style.display = 'flex';
  cache = {};
  render();
  if (currentUser && currentUser.mustChangePassword) {
    openChangePasswordForm(true);
  }
}

document.getElementById('apiBaseInput').addEventListener('change', (e)=>{
  API_BASE = e.target.value.trim().replace(/\/$/, '');
  localStorage.setItem('__awqaf_api_base__', API_BASE);
});

document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const errBox = document.getElementById('loginError');
  errBox.style.display = 'none';
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  try {
    const data = await api('/auth/login', { method:'POST', body:{ username, password } });
    currentUser = normalizeUser(data.user);
    showApp();
  } catch (err) {
    errBox.textContent = err.message;
    errBox.style.display = 'block';
  }
});

async function logout(){
  try { await api('/auth/logout', { method:'POST' }); } catch(e){}
  currentUser = null;
  cache = {};
  document.getElementById('loginPassword').value = '';
  showLogin();
}

/* ==================================================================
   إعدادات المديرية (اسم الوزارة/المديرية/العملة)
   ================================================================== */
async function loadSettingsIntoSidebar(){
  if (!can('settings.manage')) return; // من لا يملك الصلاحية يبقى على الاسم الافتراضي
  try {
    const data = await api('/settings');
    if (data.settings) document.getElementById('dirNameLabel').textContent = data.settings.directorate_name;
  } catch(e){ /* غير حرج */ }
}

const dataKeyFor = (entityKey)=> entityKey; // للتوافق مع الاستدعاءات القديمة في العرض

/** نفس منطق displayValue لكن يرجع نصاً صافياً بدون HTML — يُستخدم في التصدير لإكسل */
function plainValue(entityKey, fieldKey, item){
  const f = ENTITIES[entityKey].fields.find(x=>x.key===fieldKey);
  if(!f) return '';
  const dbKey = f.dbColumn || snakeCase(f.key);
  let v = item[dbKey];
  if(f.type==='select-ref'){
    const list = cache[f.ref]||[];
    const found = list.find(x=> String(x.id)===String(v));
    if(!found) return '';
    const labelFn = REF_LABEL[f.ref];
    return labelFn ? labelFn(found) : (found.name || '');
  }
  if(f.type==='date') return v ? String(v).slice(0,10) : '';
  if(f.boolYesNo) return v ? 'نعم' : 'لا';
  if(f.percentSelect) return (v===null||v===undefined||v==='') ? '' : `${v}%`;
  if(f.type==='number' && v!==undefined && v!=='' && v!==null) return Number(v);
  return v===null||v===undefined ? '' : v;
}

function exportToExcel(entityKey){
  const cfg = ENTITIES[entityKey];
  const list = cache[entityKey] || [];
  if (list.length===0) { showToast('لا توجد بيانات لتصديرها'); return; }
  const rows = list.map(item=>{
    const row = {};
    cfg.fields.forEach(f=>{ row[f.label] = plainValue(entityKey, f.key, item); });
    return row;
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, cfg.labelPlural.slice(0,31));
  XLSX.writeFile(wb, `${cfg.labelPlural}.xlsx`);
  showToast('تم تصدير الملف');
}

   استيراد Excel "ذكي": يتعرّف على الأعمدة من عناوينها بغض النظر عن
   ترتيبها بالملف، ويقبل تسمية العمود إما بعنوان الحقل بالعربي أو
   بمفتاحه التقني، وينظّف/ينسّق القيم تلقائياً (تواريخ، أرقام مع فواصل،
   نعم/لا بصيغ مختلفة، مطابقة تقريبية لأسماء المساجد/المشاريع...).
   ------------------------------------------------------------------ */
function normalizeHeader(s){
  return String(s||'').trim().replace(/\s+/g,' ').toLowerCase();
}
function buildFieldLookup(cfg){
  const map = new Map();
  cfg.fields.forEach(f=>{
    map.set(normalizeHeader(f.label), f);
    map.set(normalizeHeader(f.key), f);
    // يقبل العنوان بدون الملاحظات الإضافية بين قوسين، مثل "مرفقات (اسم الملف أو رابطه...)"
    const shortLabel = f.label.split('(')[0];
    map.set(normalizeHeader(shortLabel), f);
  });
  return map;
}
function excelSerialToISODate(n){
  const d = XLSX.SSF.parse_date_code(n);
  if(!d) return '';
  return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
}
function parseFlexibleDate(v){
  if (v===null||v===undefined||v==='') return '';
  if (typeof v === 'number') return excelSerialToISODate(v);
  const s = String(v).trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/); // يوم/شهر/سنة (الشائع عربياً)
  if (m) return `${m[3]}-${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`;
  const d = new Date(s);
  if (!isNaN(d.getTime())) return d.toISOString().slice(0,10);
  return s.slice(0,10);
}
function normalizeCellForField(f, rawCell){
  let cell = (rawCell===undefined||rawCell===null) ? '' : rawCell;
  if (typeof cell === 'string') cell = cell.trim();

  if (f.type==='select-ref'){
    if (!cell) return '';
    const list = cache[f.ref]||[];
    const labelFn = REF_LABEL[f.ref]||(x=>x.name);
    const target = normalizeHeader(cell);
    let match = list.find(x => normalizeHeader(labelFn(x)) === target);
    if (!match){ // مطابقة تقريبية احتياطية إذا لم يوجد تطابق تام
      const candidates = list.filter(x => normalizeHeader(labelFn(x)).includes(target) || target.includes(normalizeHeader(labelFn(x))));
      if (candidates.length===1) match = candidates[0];
    }
    return match ? match.id : '';
  }
  if (f.type==='date') return parseFlexibleDate(cell);
  if (f.boolYesNo){
    const t = normalizeHeader(cell);
    return ['نعم','yes','true','1','ايوة','صح'].includes(t) ? 'نعم' : 'لا';
  }
  if (f.percentSelect){
    if (!cell) return '';
    const n = parseInt(String(cell).replace(/[^\d]/g,''), 10);
    if (isNaN(n)) return '';
    const nearest = [5,25,50,75,100].reduce((a,b)=> Math.abs(b-n)<Math.abs(a-n)? b:a);
    return `${nearest}%`;
  }
  if (f.type==='number'){
    if (cell==='' ) return '';
    const n = parseFloat(String(cell).replace(/[^\d.\-]/g,''));
    return isNaN(n) ? '' : n;
  }
  if (f.type==='select'){
    if (!cell) return '';
    const target = normalizeHeader(cell);
    const match = f.options.find(o=> normalizeHeader(o)===target);
    return match || cell;
  }
  return cell;
}

async function importFromExcel(entityKey, file){
  const cfg = ENTITIES[entityKey];
  await ensureRefsLoaded(entityKey);
  let rawRows;
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    rawRows = XLSX.utils.sheet_to_json(sheet, { defval:'' });
  } catch(e){ showToast('تعذّر قراءة الملف — تأكد أنه ملف Excel صالح', true); return; }

  if (!rawRows || rawRows.length===0) { showToast('الملف فارغ'); return; }

  const fieldLookup = buildFieldLookup(cfg);
  const fileHeaders = Object.keys(rawRows[0]||{});
  const matchedHeaders = [], unmatchedHeaders = [];
  fileHeaders.forEach(h=>{
    if (fieldLookup.has(normalizeHeader(h))) matchedHeaders.push(h); else unmatchedHeaders.push(h);
  });

  const mappedRows = rawRows.map(raw=>{
    const values = {};
    cfg.fields.forEach(f=>{ values[f.key] = ''; }); // افتراضي فارغ لأي حقل غير موجود بالملف أصلاً
    Object.keys(raw).forEach(h=>{
      const f = fieldLookup.get(normalizeHeader(h));
      if (f) values[f.key] = normalizeCellForField(f, raw[h]);
    });
    return values;
  });

  showImportPreview(entityKey, mappedRows, matchedHeaders, unmatchedHeaders);
}

      ${unmatchedHeaders.length? `<br>أعمدة لم يتم التعرّف عليها وسيتم تجاهلها: <b>${unmatchedHeaders.join('، ')}</b>` : ''}
      <br>سيتم استيراد <b>${mappedRows.length}</b> سطر إجمالاً. المعروض أدناه أول ${previewRows.length} سطر فقط للمراجعة.

async function runImport(entityKey, mappedRows){
  const cfg = ENTITIES[entityKey];
  const modal = document.getElementById('modal');
  modal.innerHTML = `<h3>جارٍ الاستيراد...</h3><div class="empty">الرجاء الانتظار، لا تُغلق النافذة.</div>`;

  const results = [];
  for (let i=0; i<mappedRows.length; i++){
    try {
      const body = buildApiBody(cfg, mappedRows[i]);
      await api(cfg.api, { method:'POST', body });
      results.push({ row: i+2, ok:true }); // +2: أول سطر بالملف هو العناوين، والفهرسة تبدأ من 0
    } catch(err){
      results.push({ row: i+2, ok:false, error: err.message });
    }
  }
  await reload(entityKey);
  renderContent();
  showImportResults(cfg, results);
}

function showImportResults(cfg, results){
  const success = results.filter(r=>r.ok).length;
  const failed = results.filter(r=>!r.ok);
  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <h3>نتيجة الاستيراد — ${cfg.labelPlural}</h3>
    <div class="stat-strip">
      <div class="s">نجح: <b style="color:var(--good);">${success}</b></div>
      <div class="s">فشل: <b style="color:var(--danger);">${failed.length}</b></div>
    </div>
    ${failed.length? `<div style="max-height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;">
      <table><thead><tr><th>رقم السطر بالملف</th><th>سبب الفشل</th></tr></thead>
      <tbody>${failed.map(r=>`<tr><td>${r.row}</td><td>${r.error}</td></tr>`).join('')}</tbody></table>
    </div>` : ''}
    <div class="modal-actions"><button class="btn gold" id="closeImportResultsBtn">إغلاق</button></div>`;
  document.getElementById('closeImportResultsBtn').onclick = closeForm;
}

/* ==================================================================
   جلب وتخزين مؤقت للقوائم (cache) — يُعاد الجلب بعد كل إضافة/تعديل/حذف
   ================================================================== */
async function ensureLoaded(entityKey){
  if (cache[entityKey]) return cache[entityKey];
  return reload(entityKey);
}
async function reload(entityKey){
  if (entityKey === 'categories') {
    const data = await api('/transactions/categories');
    cache.categories = data.categories || [];
    return cache.categories;
  }
  if (entityKey === 'roles') {
    const data = await api('/users/roles');
    cache.roles = data.roles || [];
    return cache.roles;
  }
  if (entityKey === 'users') {
    const data = await api('/users');
    cache.users = data.users || [];
    return cache.users;
  }
  const cfg = ENTITIES[entityKey];
  const data = await api(cfg.api);
  cache[entityKey] = data[cfg.listKey] || [];
  return cache[entityKey];
}
/** يجلب كل قوائم "select-ref" التي يحتاجها نموذج معيّن قبل عرضه */
async function ensureRefsLoaded(entityKey){
  const cfg = ENTITIES[entityKey];
  if (!cfg) return;
  const refs = cfg.fields.filter(f=>f.type==='select-ref').map(f=>f.ref);
  await Promise.all([...new Set(refs)].map(ensureLoaded));
}

function fieldColumnLabel(entityKey, colKey){
  const f = ENTITIES[entityKey].fields.find(f=>f.key===colKey);
  return f ? f.label : colKey;
}
function displayValue(entityKey, colKey, item){
  const f = ENTITIES[entityKey].fields.find(f=>f.key===colKey);
  const dbKey = f ? (f.dbColumn || snakeCase(f.key)) : colKey;
  let v = item[dbKey];
  if(!f) return v==null? '—' : v;
  if(f.type==='select-ref'){
    const list = cache[f.ref]||[];
    const found = list.find(x=> String(x.id)===String(v));
    if(!found) return '—';
    const labelFn = REF_LABEL[f.ref];
    return labelFn ? labelFn(found) : (found.name || '—');
  }
  if(f.type==='date') return fmtDate(v);
  if(f.boolYesNo) return v ? 'نعم' : 'لا';
  if(f.percentSelect) return (v===null||v===undefined||v==='') ? '—' : `${v}%`;
  if(f.type==='number' && v!==undefined && v!=='' && v!==null){
    const n = Number(v);
    if(f.percent) return n.toLocaleString('ar-SY') + '%';
    if(f.money) return n.toLocaleString('ar-SY') + ' ' + (item.currency || 'ل.س');
    if(f.suffix) return n.toLocaleString('ar-SY') + ' ' + f.suffix;
    return n.toLocaleString('ar-SY');
  }
  if(v===null || v===undefined || v==='') return '—';
  if(entityKey==='transactions' && colKey==='type'){
    return `<span class="tag ${v==='وارد'?'good':'bad'}">${v}</span>`;
  }
  if(colKey==='status'){
    const goodVals=['نشط','منجز','ساري','مقبول','معتمد','مصروف','جاهز','تم ترميمه','تم بناؤه','طوائف أخرى مفعل','قائم على رأس عمله'];
    const badVals=['متوقف','منتهي','مرفوض','طوائف أخرى غير مفعل','مفصول مؤقت','مفصول نهائي'];
    const cls = goodVals.includes(v)?'good':badVals.includes(v)?'bad':'warn';
    return `<span class="tag ${cls}">${v}</span>`;
  }
  return v;
}

/* ---- Generic entity CRUD list ---- */
async function viewEntityList(entityKey){
  const cfg = ENTITIES[entityKey];
  const gate = permissionGate(cfg.perm.read);
  if (gate) return gate;

  const list = await ensureLoaded(entityKey);
  await ensureRefsLoaded(entityKey); // لتمكين عرض أسماء المراجع (المسجد/المشروع...) بالجدول

  const filterableFields = cfg.fields.filter(f=>f.type==='select' || f.type==='select-ref');
  const activeFilters = filterState[entityKey] || {};

  let items = list;
  filterableFields.forEach(f=>{
    const chosen = activeFilters[f.key];
    if (!chosen) return;
    const dbKey = f.dbColumn || snakeCase(f.key);
    items = items.filter(it=>{
      let v = it[dbKey];
      if (f.boolYesNo) v = v ? 'نعم' : 'لا';
      if (f.percentSelect) v = (v===null||v===undefined||v==='') ? '' : `${v}%`;
      return String(v) === chosen;
    });
  });

  const term = (searchTerms[entityKey]||'').trim().toLowerCase();
  if(term){ items = items.filter(it => JSON.stringify(it).toLowerCase().includes(term)); }

  const cols = cfg.columns;
  const canWrite = can(cfg.perm.write);
  const canExport = can('data.export');
  const canImport = can('data.import') && canWrite;

  const filterBarHtml = filterableFields.length===0 ? '' : `
    <div class="filter-bar">
      ${filterableFields.map(f=>{
        const opts = f.type==='select-ref' ? (cache[f.ref]||[]).map(it=>({v:it.id, l:(REF_LABEL[f.ref]||(x=>x.name))(it)}))
          : f.options.map(o=>({v:o, l:o}));
        const current = activeFilters[f.key] || '';
        return `<select data-filter-field="${entityKey}:${f.key}">
          <option value="">${f.label}: الكل</option>
          ${opts.map(o=>`<option value="${o.v}" ${String(o.v)===current?'selected':''}>${o.l}</option>`).join('')}
        </select>`;
      }).join('')}
      ${Object.keys(activeFilters).length>0 ? `<span class="clear-filters" data-clear-filters="${entityKey}">مسح الفلاتر</span>` : ''}
    </div>`;

  return `
  <div class="panel">
    <div class="panel-head">
      <h2>${cfg.labelPlural} <span style="color:var(--muted);font-weight:400;font-size:13px;">(${items.length} من ${list.length})</span></h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">

        ${canExport? `<button class="btn ghost" data-export="${entityKey}">⬇ تصدير Excel</button>` : ''}
        ${canImport? `<button class="btn ghost" data-import-trigger="${entityKey}">⬆ استيراد Excel</button>
          <input type="file" accept=".xlsx,.xls" style="display:none" data-import-input="${entityKey}">` : ''}
        ${canWrite? `<button class="btn gold" data-add="${entityKey}">+ إضافة ${cfg.label}</button>` : ''}
      </div>
    </div>
    ${filterBarHtml}
    ${items.length===0 ? `<div class="empty"><div class="big">📋</div>لا توجد بيانات مطابقة.</div>` : `
    <div style="overflow-x:auto;">
    <table><thead><tr>${cols.map(c=>`<th>${fieldColumnLabel(entityKey,c)}</th>`).join('')}${canWrite?'<th>إجراءات</th>':''}</tr></thead>
    <tbody>
      ${items.map(it=>`<tr>
        ${cols.map(c=>`<td>${displayValue(entityKey,c,it)}</td>`).join('')}
        ${canWrite? `<td><div class="row-actions">
          <button class="btn ghost sm" data-edit="${entityKey}" data-id="${it.id}">تعديل</button>
          ${cfg.noDelete? '' : `<button class="btn danger sm" data-del="${entityKey}" data-id="${it.id}">حذف</button>`}
          ${entityKey==='transactions' && !it.is_voided && can('finance.void') ? `<button class="btn danger sm" data-void="${it.id}">إلغاء</button>` : ''}
          ${it.is_voided ? `<span class="tag bad">ملغاة</span>` : ''}
        </div></td>` : ''}
      </tr>`).join('')}
    </tbody></table>
    </div>`}
  </div>`;
}

/* ---- Cashbox ---- */
async function viewCashbox(){

  </div>
  <div class="panel">

/* ---- Mosque balances ---- */
async function viewMosqueBalances(){
  const gate = permissionGate('finance.read'); if (gate) return gate;
  const [mosques, txs] = await Promise.all([ensureLoaded('mosques'), ensureLoaded('transactions')]);
  await ensureLoaded('categories');
  const cur = 'ل.س';
  const catName = (id)=> { const c=(cache.categories||[]).find(x=>x.id===id); return c? c.name : 'غير مصنف'; };

  const rows = mosques.map(m=>{
    const mtx = txs.filter(t=>String(t.mosque_id)===String(m.id) && !t.is_voided);
    const inc = mtx.filter(t=>t.type==='وارد').reduce((s,t)=>s+Number(t.amount||0),0);
    const exp = mtx.filter(t=>t.type==='صادر').reduce((s,t)=>s+Number(t.amount||0),0);
    const incByCat = {}, expByCat = {};
    mtx.forEach(t=>{
      const k = catName(t.category_id);
      if (t.type==='وارد') incByCat[k] = (incByCat[k]||0) + Number(t.amount||0);
      else expByCat[k] = (expByCat[k]||0) + Number(t.amount||0);
    });
    return { mosque:m, inc, exp, bal:inc-exp, incByCat, expByCat, count: mtx.length };
  });

  if (rows.length===0) return `<div class="panel"><div class="panel-head"><h2>رصيد المساجد</h2></div><div class="empty"><div class="big">🕌</div>أضف مساجد ومعاملات مالية لعرض الأرصدة.</div></div>`;

  return `
  <div class="panel">
    <div class="panel-head"><h2>رصيد المساجد</h2><span style="font-size:12px;color:var(--muted);">اضغط "عرض التفاصيل" لمعرفة ما صُرف عليه المسجد وما ورده من تبرعات حسب البند</span></div>
    <div style="overflow-x:auto;">
    <table><thead><tr><th>المسجد</th><th>الموقع</th><th>إجمالي الواردات</th><th>إجمالي المصروفات</th><th>الرصيد</th></tr></thead>
    <tbody>
    ${rows.map(r=>`
      <tr>
        <td>${r.mosque.name}</td>
        <td>${r.mosque.city_village || r.mosque.location || '—'}</td>
        <td>${r.inc.toLocaleString('ar-SY')} ${cur}</td>
        <td>${r.exp.toLocaleString('ar-SY')} ${cur}</td>
        <td><b style="color:${r.bal>=0?'var(--good)':'var(--danger)'}">${r.bal.toLocaleString('ar-SY')} ${cur}</b></td>
      </tr>
      <tr><td colspan="5" style="padding:0;">
        <details style="padding:6px 18px 14px;">
          <summary style="cursor:pointer;color:var(--deep);font-size:12.5px;font-weight:700;">عرض التفاصيل (${r.count} حركة)</summary>
          <div style="display:flex;gap:28px;flex-wrap:wrap;margin-top:10px;">
            <div style="min-width:220px;">
              <div style="font-size:12.5px;font-weight:700;color:var(--good);margin-bottom:6px;">التبرعات/الواردات حسب البند</div>
              ${Object.keys(r.incByCat).length? Object.entries(r.incByCat).map(([k,v])=>`<div style="font-size:12.5px;display:flex;justify-content:space-between;gap:14px;padding:3px 0;border-bottom:1px dashed var(--border);"><span>${k}</span><span>${v.toLocaleString('ar-SY')} ${cur}</span></div>`).join('') : `<div style="font-size:12px;color:var(--muted);">لا توجد واردات</div>`}
            </div>
            <div style="min-width:220px;">
              <div style="font-size:12.5px;font-weight:700;color:var(--danger);margin-bottom:6px;">المصروفات حسب البند (ما صُرف عليه المسجد)</div>
              ${Object.keys(r.expByCat).length? Object.entries(r.expByCat).map(([k,v])=>`<div style="font-size:12.5px;display:flex;justify-content:space-between;gap:14px;padding:3px 0;border-bottom:1px dashed var(--border);"><span>${k}</span><span>${v.toLocaleString('ar-SY')} ${cur}</span></div>`).join('') : `<div style="font-size:12px;color:var(--muted);">لا توجد مصروفات</div>`}
            </div>
          </div>
        </details>
      </td></tr>
    `).join('')}
    </tbody></table>
    </div>
  </div>`;
}

/* ---- Finance reports ---- */
async function viewFinanceReports(){
  const gate = permissionGate('finance.read'); if (gate) return gate;
  const [txs] = await Promise.all([ensureLoaded('transactions'), ensureLoaded('categories')]);
  const cur = 'ل.س';
  const byCategory = {};
  txs.filter(t=>!t.is_voided).forEach(t=>{
    const cat = (cache.categories||[]).find(c=>c.id===t.category_id);
    const k = cat ? cat.name : 'غير مصنف';
    byCategory[k] = byCategory[k] || {in:0, out:0};
    if(t.type==='وارد') byCategory[k].in += Number(t.amount||0); else byCategory[k].out += Number(t.amount||0);
  });
  const keys = Object.keys(byCategory);
  const totalIn = Object.values(byCategory).reduce((s,c)=>s+c.in,0);
  const totalOut = Object.values(byCategory).reduce((s,c)=>s+c.out,0);
  return `
  <div class="panel">
    <div class="panel-head"><h2>التقرير المالي حسب البند</h2>
      <button class="btn ghost no-print" onclick="window.print()">طباعة</button>
    </div>
    ${keys.length===0? `<div class="empty"><div class="big">📊</div>لا توجد معاملات مالية بعد لعرض التقرير.</div>` : `
    <table><thead><tr><th>البند</th><th>الواردات</th><th>المصروفات</th><th>الصافي</th></tr></thead>
    <tbody>${keys.map(k=>`<tr><td>${k}</td><td>${byCategory[k].in.toLocaleString('ar-SY')} ${cur}</td><td>${byCategory[k].out.toLocaleString('ar-SY')} ${cur}</td>
      <td>${(byCategory[k].in-byCategory[k].out).toLocaleString('ar-SY')} ${cur}</td></tr>`).join('')}
      <tr><td><b>الإجمالي</b></td><td><b>${totalIn.toLocaleString('ar-SY')} ${cur}</b></td><td><b>${totalOut.toLocaleString('ar-SY')} ${cur}</b></td><td><b>${(totalIn-totalOut).toLocaleString('ar-SY')} ${cur}</b></td></tr>
    </tbody></table>`}
  </div>`;
}

/* ==================================================================
   نماذج الإضافة/التعديل (Modal) — عام لكل الوحدات
   ================================================================== */
function optionsForField(f){
  if(f.type==='select-ref'){
    return (cache[f.ref]||[]).map(it=>`<option value="${it.id}">${(REF_LABEL[f.ref]||(x=>x.name))(it)}</option>`).join('');
  }
  if(f.type==='select'){ return f.options.map(o=>`<option value="${o}">${o}</option>`).join(''); }
  return '';
}

async function openForm(entityKey, id){
  const cfg = ENTITIES[entityKey];
  await ensureRefsLoaded(entityKey);
  let editing = null;
  if (id) {
    const list = await ensureLoaded(entityKey);
    editing = list.find(x=>String(x.id)===String(id));
  }
  renderFormModal(cfg, editing, async (values)=>{
    const body = buildApiBody(cfg, values);
    try {
      if (editing) {
        await api(`${cfg.api}/${editing.id}`, { method:'PUT', body });
        showToast('تم حفظ التعديلات');
      } else {
        await api(cfg.api, { method:'POST', body });
        showToast('تمت الإضافة بنجاح');
      }
      await reload(entityKey);
      closeForm();
      renderContent();
    } catch (err) {
      if (err.message === 'SESSION_EXPIRED') { showToast('انتهت الجلسة', true); return logout(); }
      showFormError(err.message);
    }
  }, entityKey);
}

function buildApiBody(cfg, values){
  const body = {};
  cfg.fields.forEach(f=>{
    let v = values[f.key];
    if (f.type==='date') { body[f.key] = v || null; return; }
    if (f.boolYesNo) { body[f.key] = v === 'نعم'; return; }
    if (f.percentSelect) { body[f.key] = v ? parseInt(v.replace('%',''),10) : null; return; }
    if (f.type==='number') { body[f.key] = (v===''||v===undefined) ? null : Number(v); return; }
    if (f.type==='select-ref') {
      if (!v) { body[f.key] = null; return; }
      body[f.key] = f.numericId ? Number(v) : v;
      return;
    }
    body[f.key] = (v===undefined || v==='') ? null : v;
  });
  return body;
}

function renderFormModal(cfg, editing, onSubmit, entityKeyForFields){
  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <h3>${editing? 'تعديل ' : 'إضافة '} ${cfg.label}</h3>
    <div id="formErrorBox" style="display:none" class="form-error"></div>
    <form id="entityForm">
      <div class="form-grid">
      ${cfg.fields.map(f=>{
        let rawVal = editing ? editing[f.dbColumn || snakeCase(f.key)] : undefined;
        if (rawVal === undefined && editing) rawVal = editing[f.key]; // احتياط لو المفتاح غير مُحوَّل
        let val;
        if (editing) {
          if (f.type==='date') val = pgDate(rawVal);
          else if (f.boolYesNo) val = rawVal ? 'نعم' : 'لا';
          else if (f.percentSelect) val = (rawVal===null||rawVal===undefined) ? '' : `${rawVal}%`;
          else val = rawVal===null||rawVal===undefined ? '' : rawVal;
        } else {
          val = f.defaultToday ? todayISO() : '';
        }
        if(f.type==='textarea'){
          return `<div class="field field-full"><label>${f.label}</label><textarea name="${f.key}">${val}</textarea></div>`;
        }
        if(f.type==='select' || f.type==='select-ref'){
          return `<div class="field"><label>${f.label}</label><select name="${f.key}" ${f.required?'required':''} data-val="${val}">
            <option value="">— اختر —</option>${optionsForField(f)}</select></div>`;
        }
        return `<div class="field"><label>${f.label}</label><input type="${f.type}" name="${f.key}" value="${val}" ${f.required?'required':''}></div>`;
      }).join('')}
      </div>
      <div class="modal-actions">
        <button type="submit" class="btn gold">${editing?'حفظ التعديلات':'إضافة'}</button>
        <button type="button" class="btn ghost" id="cancelFormBtn">إلغاء</button>
      </div>
    </form>`;
  // ضبط قيم القوائم المنسدلة (select) بعد إدراجها بالـ DOM
  modal.querySelectorAll('select[data-val]').forEach(el=>{ el.value = el.getAttribute('data-val') || ''; });

  document.getElementById('overlay').classList.add('show');
  document.getElementById('cancelFormBtn').onclick = closeForm;
  document.getElementById('entityForm').onsubmit = (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const values = {};
    cfg.fields.forEach(f=>{ values[f.key] = fd.get(f.key); });
    onSubmit(values);
  };
}
function showFormError(msg){
  const box = document.getElementById('formErrorBox');
  if (box) { box.textContent = msg; box.style.display = 'block'; }
  else showToast(msg, true);
}
function closeForm(){ document.getElementById('overlay').classList.remove('show'); }

// الحقول القادمة من الـ API تكون بأسماء snake_case (مطابقة لأعمدة قاعدة
// البيانات)، بينما مفاتيح النموذج بالواجهة camelCase — هذه الدالة تحوّل
// بينهما فقط عند تحميل بيانات للتعديل.
function snakeCase(s){ return s.replace(/[A-Z]/g, m => '_' + m.toLowerCase()); }

/* ==================================================================
   نموذج خاص بالمستخدمين (يختلف بنيوياً عن باقي الوحدات)
   ================================================================== */
const EXTRA_PERMISSION_OPTIONS = [
  { code:'data.export', label:'تصدير بيانات أي قسم إلى Excel' },
  { code:'data.import', label:'استيراد بيانات إلى النظام من Excel' },
];

async function openUserForm(id){
  await ensureLoaded('roles');
  let editing = null;
  if (id) { const users = await reload('users'); editing = users.find(u=>String(u.id)===String(id)); }
  const editingExtra = editing ? (editing.extra_permissions || []) : [];

  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <h3>${editing? 'تعديل مستخدم' : 'إضافة مستخدم'}</h3>
    <div id="formErrorBox" style="display:none" class="form-error"></div>
    <form id="userForm">
      <div class="form-grid">
        <div class="field"><label>اسم المستخدم (أحرف/أرقام إنكليزية فقط)</label>
          <input name="username" value="${editing?editing.username:''}" ${editing?'disabled':''} required></div>
        <div class="field"><label>الاسم الكامل</label><input name="fullName" value="${editing?editing.full_name:''}" required></div>
        ${editing? '' : `<div class="field"><label>كلمة السر (10 أحرف فأكثر، حرف كبير وصغير ورقم ورمز)</label><input type="password" name="password" required></div>`}
        <div class="field"><label>الدور الوظيفي</label>
          <select name="roleCode" required>${(cache.roles||[]).map(r=>`<option value="${r.code}" ${editing && editing.role_code===r.code?'selected':''}>${r.name_ar}</option>`).join('')}</select>
        </div>
        ${editing? `<div class="field"><label>الحساب</label><select name="isActive"><option value="true" ${editing.is_active?'selected':''}>مفعّل</option><option value="false" ${!editing.is_active?'selected':''}>معطّل</option></select></div>` : ''}
        <div class="field field-full">
          <label>صلاحيات إضافية فوق الدور الوظيفي (اختياري)</label>
          <div class="checkbox-group">
            ${EXTRA_PERMISSION_OPTIONS.map(p=>`<label class="chk"><input type="checkbox" name="extraPerm" value="${p.code}" ${editingExtra.includes(p.code)?'checked':''}> ${p.label}</label>`).join('')}
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button type="submit" class="btn gold">${editing?'حفظ':'إضافة'}</button>
        <button type="button" class="btn ghost" id="cancelUserFormBtn">إلغاء</button>
      </div>
    </form>`;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('cancelUserFormBtn').onclick = closeForm;
  document.getElementById('userForm').onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const extraPermissionCodes = fd.getAll('extraPerm');
    try {
      if (editing) {
        await api(`/users/${editing.id}`, { method:'PATCH', body:{
          fullName: fd.get('fullName'), roleCode: fd.get('roleCode'), isActive: fd.get('isActive')==='true', extraPermissionCodes,
        }});
        showToast('تم حفظ التعديلات');
      } else {
        await api('/users', { method:'POST', body:{
          username: fd.get('username'), fullName: fd.get('fullName'), password: fd.get('password'), roleCode: fd.get('roleCode'), extraPermissionCodes,
        }});
        showToast('تمت إضافة المستخدم');
      }
      await reload('users');
      closeForm();
      renderContent();
    } catch(err){
      if (err.message === 'SESSION_EXPIRED') { showToast('انتهت الجلسة', true); return logout(); }
      showFormError(err.message);
    }
  };
}

async function openResetPasswordDialog(id){
  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <h3>إعادة تعيين كلمة السر</h3>
    <div id="formErrorBox" style="display:none" class="form-error"></div>
    <form id="resetPwForm">
      <div class="field"><label>كلمة السر الجديدة (10 أحرف فأكثر، حرف كبير وصغير ورقم ورمز)</label><input type="password" name="newPassword" required></div>
      <div class="modal-actions">
        <button type="submit" class="btn gold">تأكيد</button>
        <button type="button" class="btn ghost" id="cancelResetBtn">إلغاء</button>
      </div>
    </form>`;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('cancelResetBtn').onclick = closeForm;
  document.getElementById('resetPwForm').onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    try {
      await api(`/users/${id}/reset-password`, { method:'POST', body:{ newPassword: fd.get('newPassword') } });
      showToast('تم إعادة تعيين كلمة السر — سيُطلب من المستخدم تغييرها عند الدخول');
      closeForm();
    } catch(err){ showFormError(err.message); }
  };
}

  modal.innerHTML = `
    <h3>إلغاء معاملة مالية</h3>
    <div id="formErrorBox" style="display:none" class="form-error"></div>
    <form id="voidForm">
      <div class="field"><label>سبب الإلغاء (إلزامي)</label><textarea name="reason" required></textarea></div>
      <div class="modal-actions">
        <button type="submit" class="btn danger">تأكيد الإلغاء</button>
        <button type="button" class="btn ghost" id="cancelVoidBtn">تراجع</button>
      </div>
    </form>`;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('cancelVoidBtn').onclick = closeForm;
  document.getElementById('voidForm').onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    try {
      await api(`/transactions/${id}/void`, { method:'POST', body:{ reason: fd.get('reason') } });
      showToast('تم إلغاء المعاملة');
      await reload('transactions');
      closeForm();
      renderContent();
    } catch(err){ showFormError(err.message); }
  };
}

/**
 * نموذج تغيير كلمة السر — يُستخدم في حالتين:
 * 1) forced=true: بعد أول دخول بكلمة سر مؤقتة وضعها مدير النظام (must_change_password).
 *    هنا لا يوجد زر إلغاء ولا يمكن إغلاق النافذة بالضغط خارجها — يجب إكمال
 *    التغيير قبل استخدام النظام، حتى لا يبقى مدير النظام عارفاً كلمة سر
 *    الموظف الفعلية بعد أول استخدام.
 * 2) forced=false: تغيير طوعي في أي وقت من قائمة المستخدم الجانبية.
 */
function openChangePasswordForm(forced){
  forcedPasswordChangeActive = !!forced;
  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <h3>${forced? 'يجب تغيير كلمة السر قبل المتابعة' : 'تغيير كلمة السر'}</h3>
    <div id="formErrorBox" style="display:none" class="form-error"></div>
    ${forced? `<p style="font-size:12.5px;color:var(--muted);margin-top:-8px;">تم تعيين كلمة سر مؤقتة لحسابك من قبل مدير النظام. لأسباب أمنية يجب استبدالها بكلمة سر خاصة بك وحدك الآن قبل المتابعة.</p>` : ''}
    <form id="changePwForm">
      <div class="field"><label>${forced?'كلمة السر المؤقتة الحالية':'كلمة السر الحالية'}</label><input type="password" name="oldPassword" required autocomplete="current-password"></div>
      <div class="field"><label>كلمة السر الجديدة (10 أحرف فأكثر، حرف كبير وصغير ورقم ورمز خاص)</label><input type="password" name="newPassword" required autocomplete="new-password"></div>
      <div class="field"><label>تأكيد كلمة السر الجديدة</label><input type="password" name="confirmPassword" required autocomplete="new-password"></div>
      <div class="modal-actions">
        <button type="submit" class="btn gold">تغيير كلمة السر</button>
        ${forced? '' : `<button type="button" class="btn ghost" id="cancelChangePwBtn">إلغاء</button>`}
      </div>
    </form>`;
  document.getElementById('overlay').classList.add('show');
  if (!forced) document.getElementById('cancelChangePwBtn').onclick = closeForm;
  document.getElementById('changePwForm').onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const newPw = fd.get('newPassword'), confirmPw = fd.get('confirmPassword');
    if (newPw !== confirmPw) { showFormError('كلمتا السر الجديدتان غير متطابقتين'); return; }
    try {
      await api('/auth/change-password', { method:'POST', body:{ oldPassword: fd.get('oldPassword'), newPassword: newPw } });
      currentUser.mustChangePassword = false;
      forcedPasswordChangeActive = false;
      document.getElementById('overlay').classList.remove('show');
      showToast('تم تغيير كلمة السر بنجاح');
    } catch(err){
      if (err.message === 'SESSION_EXPIRED') { showToast('انتهت الجلسة', true); return logout(); }
      showFormError(err.message);
    }
  };
}

/* ==================================================================
   تفويض الأحداث (Event delegation)
   ================================================================== */
document.addEventListener('click', (e)=>{
  const nav = e.target.closest('[data-nav]');
  if(nav){ currentModule = nav.getAttribute('data-nav'); searchTerms={}; render(); return; }

  const grp = e.target.closest('[data-toggle-group]');
  if(grp){
    if (sidebarCollapsed) { sidebarCollapsed = false; localStorage.setItem('__awqaf_sidebar_collapsed__','0'); applySidebarCollapsedState(); }
    const g = grp.getAttribute('data-toggle-group'); openGroups[g] = !openGroups[g]; renderSidebar(); return;
  }

  if(e.target.id==='sidebarCollapseBtn'){ toggleSidebarCollapse(); return; }
  if(e.target.id==='logoutBtn'){ logout(); return; }
  if(e.target.id==='changePwBtn'){ openChangePasswordForm(false); return; }
  if(e.target.id==='menuBtn'){ document.getElementById('sidebar').classList.toggle('open'); return; }

  const addBtn = e.target.closest('[data-add]');
  if(addBtn){ openForm(addBtn.getAttribute('data-add'), null); return; }
  const editBtn = e.target.closest('[data-edit]');
  if(editBtn){ openForm(editBtn.getAttribute('data-edit'), editBtn.getAttribute('data-id')); return; }

  if(e.target.closest('[data-add-user]')){ openUserForm(null); return; }
  const editUserBtn = e.target.closest('[data-edit-user]');
  if(editUserBtn){ openUserForm(editUserBtn.getAttribute('data-edit-user')); return; }
  const resetPwBtn = e.target.closest('[data-reset-pw]');
  if(resetPwBtn){ openResetPasswordDialog(resetPwBtn.getAttribute('data-reset-pw')); return; }

  const voidBtn = e.target.closest('[data-void]');
  if(voidBtn){ openVoidDialog(voidBtn.getAttribute('data-void')); return; }

  const delBtn = e.target.closest('[data-del]');
  if(delBtn){
    const entityKey = delBtn.getAttribute('data-del');
    const id = delBtn.getAttribute('data-id');
    const cfg = ENTITIES[entityKey];
    if(confirm(`هل أنت متأكد من حذف هذا ${cfg.label}؟`)){
      api(`${cfg.api}/${id}`, { method:'DELETE' }).then(async ()=>{
        showToast('تم الحذف');
        await reload(entityKey);
        renderContent();
      }).catch(err=>{
        if (err.message === 'SESSION_EXPIRED') { showToast('انتهت الجلسة', true); return logout(); }
        showToast(err.message, true);
      });
    }
    return;
  }

  if(e.target.id==='overlay'){ if(!forcedPasswordChangeActive) closeForm(); return; }

  const exportBtn = e.target.closest('[data-export]');
  if(exportBtn){ exportToExcel(exportBtn.getAttribute('data-export')); return; }

  const importTriggerBtn = e.target.closest('[data-import-trigger]');
  if(importTriggerBtn){
    const entityKey = importTriggerBtn.getAttribute('data-import-trigger');
    const input = document.querySelector(`[data-import-input="${entityKey}"]`);
    if(input) input.click();
    return;
  }

  const clearFiltersBtn = e.target.closest('[data-clear-filters]');
  if(clearFiltersBtn){ filterState[clearFiltersBtn.getAttribute('data-clear-filters')] = {}; renderContent(); return; }

  if(e.target.id==='saveSettingsBtn'){
    const body = {
      ministryName: document.getElementById('set-ministryName').value,
      directorateName: document.getElementById('set-directorateName').value,
      currencyCode: document.getElementById('set-currency').value,
    };
    api('/settings', { method:'PUT', body }).then(()=>{
      showToast('تم حفظ الإعدادات');
      loadSettingsIntoSidebar();
      renderContent();
    }).catch(err=> showToast(err.message, true));
    return;
  }
});

document.addEventListener('change', (e)=>{
  const filterSel = e.target.closest('[data-filter-field]');
  if(filterSel){
    const [entityKey, fieldKey] = filterSel.getAttribute('data-filter-field').split(':');
    filterState[entityKey] = filterState[entityKey] || {};
    if (filterSel.value) filterState[entityKey][fieldKey] = filterSel.value;
    else delete filterState[entityKey][fieldKey];
    renderContent();
    return;
  }
  const importInput = e.target.closest('[data-import-input]');
  if(importInput && importInput.files && importInput.files[0]){
    const entityKey = importInput.getAttribute('data-import-input');
    const file = importInput.files[0];
    importInput.value = ''; // يسمح باختيار نفس الملف مرة أخرى لاحقاً
    importFromExcel(entityKey, file);
    return;
  }
});

document.addEventListener('input', (e)=>{
  const s = e.target.closest('[data-search]');
  if(s){ searchTerms[s.getAttribute('data-search')] = s.value; renderContent(); }
});

/* ==================================================================
   الإقلاع
   ================================================================== */
tryRestoreSession();
</script>
